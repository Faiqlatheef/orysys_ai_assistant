[project]
name = "orysys-enterprise-ai-assistant"
version = "0.1.0"
description = "Enterprise AI assistant assessment POC: LangGraph, hybrid RAG, RLM, RBAC and observability"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "streamlit>=1.39,<2",
  "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "python-dotenv>=1,<2",
  "langgraph>=0.2,<2", "langchain-core>=0.3,<2", "langsmith>=0.1,<1",
  "pinecone>=5,<8", "openai>=1.50,<3", "rank-bm25>=0.2,<1", "numpy>=1.26,<3",
  "pytest>=8,<9", "pytest-asyncio>=0.24,<2", "python-multipart>=0.0.9,<1", "pypdf>=5,<7", "python-docx>=1.1,<2"
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]
